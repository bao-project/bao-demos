# Bao guest Kconfig fragment for TC4D7 (TriCore).
#
# CONFIG_XIP=n: link into zephyr,sram (RAM) instead of PFLASH, so Bao can
# load and jump straight to the binary.
# CONFIG_TRICORE_VIRTUALIZATION=y: skip the reset-time
# z_tricore_cpu_disable_virtualization call, which would tear down Bao.
# CONFIG_TRICORE_VM_ID=1: VM0 is Bao itself.
CONFIG_XIP=n
CONFIG_TRICORE_VIRTUALIZATION=y
CONFIG_TRICORE_VM_ID=1
