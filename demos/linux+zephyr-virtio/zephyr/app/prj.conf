# Code and read-only data stay in the VM's private memory region (zephyr,flash)
# while all RAM is placed in the shared memory region (zephyr,sram), so that
# the VirtIO backend can access the virtqueues and the driver buffers.
CONFIG_XIP=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_VIRTIO=y
CONFIG_UART_VIRTIO_CONSOLE=y

# Report driver errors on the console
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
