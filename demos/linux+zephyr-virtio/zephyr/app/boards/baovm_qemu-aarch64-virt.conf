# Run Zephyr on a single CPU. Zephyr's AArch64 SMP boot elects the primary
# CPU through a variable in .data, which an XIP image only initializes later,
# when the data section is copied to RAM.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1

# The XIP layout places the code and the RAM in two distant regions and the
# VirtIO device is mapped at run time: more translation tables are needed than
# the default.
CONFIG_MAX_XLAT_TABLES=16
