# The Zephyr VM has a single CPU (see configs/qemu-aarch64-virt.c), while the
# board enables SMP with two.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1

# The shared memory pool lies far from the private RAM and the VirtIO device
# is mapped at run time: more translation tables are needed than the default.
CONFIG_MAX_XLAT_TABLES=16
