CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_VIRTIO=y
CONFIG_UART_VIRTIO_CONSOLE=y

# The memory the VirtIO backend can access is confined to the region named by
# the memory-region property of the virtio-mmio node (see the devicetree
# overlay): CONFIG_VIRTIO_RESTRICTED_DMA_POOL defaults to y when the devicetree
# has a restricted-dma-pool node.

# Report driver errors on the console
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# The VirtIO network device, with a static address on the network of the
# backend VM. Its driver is enabled by the virtio,net devicetree node.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.42.16"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_TEST_RANDOM_GENERATOR=y

# The VirtIO block device. Its driver is enabled by the virtio,blk devicetree
# node.
CONFIG_DISK_ACCESS=y
