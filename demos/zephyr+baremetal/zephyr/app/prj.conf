CONFIG_VIRTUALIZATION=y
CONFIG_BAO_IPCSHMEM=y
CONFIG_SHELL=y
CONFIG_BAO_IPCSHMEM_SHELL=y
CONFIG_DYNAMIC_INTERRUPTS=y

# Reprogramming the shared PLL broke baremetal's interrupts (STM timer,
# UART RX) -- see overlays/tricore/app.overlay for the resulting clock
# frequency corrections.
CONFIG_AURIX_STARTUP_CPU=n